        // Hàm thay đổi ngôn ngữ
        function changeLanguage(lang) {
            const t = translations[lang];
            
            // Cập nhật thẻ title của trình duyệt
            document.getElementById('page-title').innerText = t.title;
            document.documentElement.lang = lang; // Cập nhật thuộc tính lang của HTML

            // Lặp qua tất cả các thẻ có thuộc tính data-i18n và cập nhật nội dung
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) {
                    el.innerHTML = t[key];
                }
            });
        }

        // Chạy hàm này khi trang vừa load xong để thiết lập Tiếng Anh làm mặc định
        document.addEventListener('DOMContentLoaded', () => {
            changeLanguage('en');
        });
    </script>
