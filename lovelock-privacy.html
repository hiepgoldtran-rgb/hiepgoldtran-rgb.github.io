        function changeLang(lang) {
            const t = translations[lang] || translations.en;
            document.getElementById('mainTitle').innerText = t.title;
            document.getElementById('lastUpdated').innerText = t.updated;
            
            let html = `<p>${t.intro}</p>`;
            t.sections.forEach(s => {
                html += `<h2>${s.h2}</h2>`;
                html += `<p>${s.p}</p>`;
                if (s.ul) {
                    html += `<ul>${s.ul.map(item => `<li>${item}</li>`).join('')}</ul>`;
                }
                if (s.extra) {
                    html += `<p>${s.extra}</p>`;
                }
                if (s.contact) {
                    html += `<p>${s.contact}</p>`;
                }
            });
            document.getElementById('content').innerHTML = html;
            document.documentElement.lang = lang;
        }

        // Initialize with browser language or default
        const browserLang = navigator.language.split('-')[0];
        const initialLang = translations[browserLang] ? browserLang : 'en';
        document.getElementById('langSelect').value = initialLang;
        changeLang(initialLang);
